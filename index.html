<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Wishlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --ink: #24211e;
    --muted: #807870;
    --accent: #2f3e36;
    --accent-dark: #1f2a24;
    --done: #4f7a5a;
    --done-soft: #e8efe8;
    --line: #e6e0d7;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: Inter, system-ui, sans-serif;
    color: var(--ink);
    line-height: 1.5;
    min-height: 100vh;
    background: var(--bg);
    overflow-x: hidden;
  }
  /* floating background emoji */
  .floaters { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .floaters span {
    position: absolute; bottom: -60px; font-size: 28px; opacity: .35;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(-115vh) rotate(260deg); }
  }
  @media (prefers-reduced-motion: reduce) { .floaters { display: none; } }

  .wrap { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 48px 20px 80px; }
  header { text-align: center; }
  .bigbow { display: none; }
  @keyframes wiggle { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg) scale(1.06); } }
  header h1 {
    font-family: Fraunces, Georgia, serif; font-weight: 600;
    font-size: clamp(2.4rem, 7vw, 3.6rem);
    margin: 4px 0 10px; line-height: 1.05; letter-spacing: -0.02em;
  }
  header p { margin: 0 auto; color: var(--muted); max-width: 56ch; font-size: 1.05rem; }
  .note {
    margin: 24px auto 8px; max-width: 560px; text-align: center;
    padding: 10px 16px; background: #fff; border: 1px solid var(--line);
    border-radius: 12px; font-size: 0.9rem; color: var(--muted);
  }
  .note.demo { background: #fbf6e8; }
  .filters { display: flex; gap: 8px; margin: 24px 0 20px; flex-wrap: wrap; justify-content: center; }
  .filters button {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: 7px 16px; border-radius: 999px; font: inherit; font-weight: 500; font-size: 0.92rem; cursor: pointer;
    transition: transform .15s;
  }
  .filters button:hover { transform: translateY(-2px); }
  .filters button.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
  li.item {
    background: var(--card); border-radius: 16px; overflow: hidden;
    border: 1px solid var(--line);
    display: flex; flex-direction: column;
    transition: transform .2s, box-shadow .2s;
    animation: pop .4s ease-out both;
  }
  li.item:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,.06); }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } }

  .pic {
    position: relative; height: 170px; overflow: hidden; display: grid; place-items: center;
    background: var(--g, #ece6dc);
  }
  .pic .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; padding: 10px; z-index: 1; transition: transform .4s; }
  li.item:hover .pic .photo { transform: scale(1.04); }
  .pic .tag, .pic .stamp { z-index: 2; }
  .pic .photo.logo { padding: 36px 48px; }
  .pic .emoji { font-size: 60px; transition: transform .3s; }
  li.item:hover .pic .emoji { transform: scale(1.08); }
  .pic .sparkle { display: none; }
  .pic .sparkle.s1 { top: 14px; left: 18px; } .pic .sparkle.s2 { bottom: 16px; right: 20px; }
  .pic .tag {
    position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,.8);
    padding: 2px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 500; color: var(--ink);
  }
  /* gift-card look */
  .pic.gc { align-content: center; }
  .pic.gc .card {
    width: 78%; height: 100px; border-radius: 14px; padding: 12px 14px; color: #fff;
    background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,0)), var(--gc, #555);
    box-shadow: 0 8px 18px rgba(0,0,0,.14); transform: rotate(-3deg);
    display: flex; flex-direction: column; justify-content: space-between; transition: transform .3s;
  }
  li.item:hover .pic.gc .card { transform: rotate(0deg); }
  .pic.gc .brand { font-family: Fraunces, Georgia, serif; font-size: 1.3rem; font-weight: 600; line-height: 1.1; }
  .pic.gc .row2 { display: flex; justify-content: space-between; align-items: end; font-size: .68rem; font-weight: 600; letter-spacing: .1em; opacity: .9; }
  .pic.gc .row2 .e { font-size: 22px; letter-spacing: 0; opacity: .9; }

  .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .name { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 1.1rem; line-height: 1.25; }
  .meta { color: var(--muted); font-size: 0.9rem; }
  .price { font-weight: 600; color: var(--ink); }
  .meta a { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  .noteline { font-size: 0.88rem; color: var(--muted); }
  .right { margin-top: auto; padding-top: 6px; }
  button.claim {
    width: 100%; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600; font-size: .95rem;
    padding: 11px 16px; border-radius: 10px; cursor: pointer;
    transition: transform .1s, box-shadow .1s;
  }
  button.claim:hover { transform: translateY(-1px); }
  button.claim:active { transform: translateY(1px); }
  button.claim:hover { background: var(--accent-dark); }
  .status {
    display: block; background: var(--done-soft); color: var(--done); text-align: center;
    font-weight: 600; font-size: 0.9rem; padding: 9px 12px; border-radius: 10px;
  }
  .undo { display: block; margin: 8px auto 0; font-size: 0.82rem; color: var(--muted); background: none; border: 0; cursor: pointer; text-decoration: underline; padding: 0; font-family: inherit; }

  li.item.claimed .pic { filter: grayscale(.7); opacity: .75; }
  li.item.claimed .name { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
  .stamp {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-12deg);
    background: #fff; color: var(--done); border: 2px solid var(--done); border-radius: 8px;
    padding: 3px 12px; font-family: Inter, sans-serif; font-weight: 600; font-size: 1rem; letter-spacing: .04em;
  }

  footer { margin-top: 44px; color: var(--muted); font-size: 0.85rem; text-align: center; }

  dialog {
    border: 0; border-radius: 16px; padding: 26px; max-width: 380px; width: 90%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.2); font-family: Inter, sans-serif; color: var(--ink);
  }
  dialog::backdrop { background: rgba(36,33,30,.4); }
  dialog .dlgEmoji { font-size: 44px; }
  dialog h2 { font-family: Fraunces, Georgia, serif; margin: 4px 0 6px; font-size: 1.5rem; }
  dialog p { margin: 0 0 16px; color: var(--muted); font-size: 0.95rem; }
  dialog input {
    width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; font: inherit; margin-bottom: 16px;
  }
  dialog input:focus { outline: none; border-color: var(--ink); }
  .row { display: flex; gap: 8px; justify-content: center; }
  .row button { font: inherit; font-weight: 500; padding: 10px 18px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: #fff; }
  .row button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

  .confetti { position: fixed; top: -12px; width: 10px; height: 14px; z-index: 50; pointer-events: none; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>

<style>
  /* ===== Bordeaux glam theme ===== */
  :root {
    --wine: #5a0f22; --wine-dark: #3a0715; --wine-deep: #2a0510;
    --gold: #d8b46a; --gold-soft: #f1dfb3; --cream: #fdf8f2;
    --ink: #2b1118; --muted: #7c5c63; --line: #ecdcd3;
  }
  body {
    font-family: Inter, system-ui, sans-serif; color: var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -10%, #7a1630 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 30%, #4a0a1c 0%, transparent 60%),
      linear-gradient(180deg, var(--wine-dark) 0%, var(--wine-deep) 100%);
    background-attachment: fixed;
  }
  .sparkles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .sparkles i {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: var(--gold-soft); box-shadow: 0 0 6px 2px rgba(241,223,179,.7);
    animation: twinkle ease-in-out infinite; opacity: 0;
  }
  .sparkles i.star { width: 12px; height: 12px; background: none; box-shadow: none; }
  .sparkles i.star::before, .sparkles i.star::after {
    content: ""; position: absolute; left: 50%; top: 50%; background: var(--gold-soft);
    transform: translate(-50%,-50%); border-radius: 2px; box-shadow: 0 0 8px rgba(241,223,179,.9);
  }
  .sparkles i.star::before { width: 2px; height: 12px; }
  .sparkles i.star::after { width: 12px; height: 2px; }
  @keyframes twinkle { 0%,100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .sparkles { display: none; } }

  .wrap { max-width: 1040px; padding: 56px 18px 72px; }
  header { color: var(--cream); }
  .kicker { font-size: .78rem; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
  header h1 {
    font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-style: italic;
    font-size: clamp(2.6rem, 9vw, 4.4rem); margin: 0 0 14px; letter-spacing: -.01em;
    background: linear-gradient(100deg, #f6e7c1 0%, #d8b46a 35%, #fff4d6 50%, #c99a45 65%, #f6e7c1 100%);
    background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 6s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .divider { width: 120px; height: 1px; margin: 0 auto 16px; background: linear-gradient(90deg, transparent, var(--gold), transparent); position: relative; }
  .divider::after { content: "✦"; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-55%); color: var(--gold); font-size: 14px; background: transparent; padding: 0 8px; }
  header p { color: rgba(253,248,242,.78); }
  .note { background: rgba(255,255,255,.06); border: 1px solid rgba(216,180,106,.35); color: rgba(253,248,242,.85); backdrop-filter: blur(4px); }

  .filters { margin: 28px 0 22px; gap: 8px; }
  .filters button {
    background: rgba(255,255,255,.06); color: var(--cream); border: 1px solid rgba(216,180,106,.35);
    padding: 8px 16px; font-weight: 500;
  }
  .filters button:hover { border-color: var(--gold); }
  .filters button.on { background: linear-gradient(135deg, #e9cd8a, #c99a45); color: var(--wine-deep); border-color: transparent; font-weight: 600; }
  @media (max-width: 600px) {
    .filters { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; padding-bottom: 6px; margin-left: -18px; margin-right: -18px; padding-left: 18px; padding-right: 18px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filters button { flex: 0 0 auto; }
  }

  ul { gap: 22px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  li.item {
    background: var(--cream); border: 1px solid rgba(216,180,106,.45); border-radius: 18px;
    box-shadow: 0 18px 40px rgba(20,0,6,.35);
  }
  li.item:hover { transform: translateY(-4px); box-shadow: 0 24px 50px rgba(20,0,6,.45), 0 0 0 1px var(--gold); }
  .pic { height: 190px; background: #fff; border-bottom: 1px solid var(--line); }
  .pic .tag { background: var(--wine); color: var(--gold-soft); font-weight: 500; letter-spacing: .04em; }
  .name { font-family: "Playfair Display", Georgia, serif; font-size: 1.18rem; color: var(--wine-dark); }
  .price { color: var(--wine); }
  .meta a { color: var(--wine); }
  .noteline { color: var(--muted); font-size: .9rem; }
  button.claim {
    background: linear-gradient(135deg, #7a1630, var(--wine)); border: 1px solid rgba(216,180,106,.6);
    color: var(--gold-soft); letter-spacing: .02em; padding: 12px 16px; border-radius: 12px;
  }
  button.claim:hover { background: linear-gradient(135deg, #8d1a38, #6a1228); box-shadow: 0 0 0 3px rgba(216,180,106,.25); }
  .status { background: #f6ecd6; color: var(--wine); border: 1px solid rgba(216,180,106,.6); }
  .stamp { color: var(--wine); border-color: var(--gold); }
  dialog { background: var(--cream); border: 1px solid var(--gold); }
  dialog h2 { font-family: "Playfair Display", Georgia, serif; color: var(--wine-dark); }
  .row button.primary { background: var(--wine); border-color: var(--wine); color: var(--gold-soft); }
  .empty { color: var(--cream); text-align: center; grid-column: 1/-1; padding: 30px 0; opacity: .8; }

  @media (max-width: 600px) {
    .wrap { padding-top: 40px; }
    ul { grid-template-columns: 1fr; gap: 16px; }
    .pic { height: 210px; }
    header p { font-size: .98rem; }
  }
</style>

</style>
</head>
<body>
<div class="sparkles" id="sparkles"></div>
<div class="wrap">
  <header>
    <div class="kicker">Katja's</div>
    <h1 id="title">Wishlist</h1>
    <div class="divider"></div>
    <p id="intro">A few things I'd love. If you're getting me something, tap "I'll get this" so nobody else buys the same gift. Thank you!</p>
  </header>

  <div class="note" id="note">When someone claims a gift it disappears from this list, so nobody (not even me) can see who's getting what. 🤫</div>


  <ul id="list"></ul>
</div>

<dialog id="dlg">
  <div class="dlgEmoji" id="dlgEmoji">🎁</div>
  <h2>Is this your gift?</h2>
  <p id="dlgItem"></p>

  <div class="row">
    <button id="dlgCancel">Cancel</button>
    <button id="dlgOk" class="primary">Yes, mark it</button>
  </div>
</dialog>

/* ============================================================
   2) FIREBASE CONFIG: paste yours here (see setup steps).
      While this is empty the page runs in demo mode and
      claims are only saved in your own browser.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDdQrmG-a_5cA2-HIW8bpBUG1SErhCTRMI",
  authDomain: "wishlist-e9655.firebaseapp.com",
  projectId: "wishlist-e9655",
  storageBucket: "wishlist-e9655.firebasestorage.app",
  messagingSenderId: "677194251418",
  appId: "1:677194251418:web:d6eeba3c44db4e78ee3323"
};

/* ------------------------------------------------------------ */
const listEl = document.getElementById("list");
const noteEl = document.getElementById("note");
let claims = {};
let filter = "all";
const mine = JSON.parse(localStorage.getItem("wishlist-mine") || "{}");
const saveMine = () => { try { localStorage.setItem("wishlist-mine", JSON.stringify(mine)); } catch {} };

let store;
if (firebaseConfig.projectId) {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const db = fs.getFirestore(initializeApp(firebaseConfig));
  const col = fs.collection(db, "claims");
  fs.onSnapshot(col, snap => {
    claims = {};
    snap.forEach(d => { const v = d.data(); (claims[v.item] ||= []).push({ ...v, key: d.id }); });
    render();
  }, err => { noteEl.textContent = "Couldn't load claims: " + err.message; noteEl.className = "note demo"; });
  store = {
    claim: async (item, by) => (await fs.addDoc(col, { item, by, at: Date.now() })).id,
    unclaim: key => fs.deleteDoc(fs.doc(db, "claims", key)),
  };
} else {
  noteEl.textContent = "Demo mode: claims are only saved in this browser until the Firebase config is added.";
  noteEl.className = "note demo";
  let rows = JSON.parse(localStorage.getItem("wishlist-demo2") || "[]");
  const persist = () => {
    localStorage.setItem("wishlist-demo2", JSON.stringify(rows));
    claims = {}; rows.forEach(r => (claims[r.item] ||= []).push(r)); render();
  };
  store = {
    claim: async (item, by) => { const key = Math.random().toString(36).slice(2); rows.push({ item, by, at: Date.now(), key }); persist(); return key; },
    unclaim: async key => { rows = rows.filter(r => r.key !== key); persist(); },
  };
  rows.forEach(r => (claims[r.item] ||= []).push(r));
}

const TAG_COLORS = {
  "Gift card": "#ece6dc",
  "Gym": "#e4e7e0",
  "Kitchen": "#efe8da",
  "Beauty": "#ede4e1",
  "Cozy": "#e3e6ea",
  "Games": "#e6e2ec",
  "Home": "#e9e6df",
  "Books": "#ebe5dc",
  default: "#ece6dc",
};

function confetti() {
  const colors = ["#d8b46a","#f6ead8","#7a1630","#c9a0a8"];
  for (let i = 0; i < 36; i++) {
    const d = document.createElement("div");
    d.className = "confetti";
    d.style.left = Math.random() * 100 + "vw";
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = 1.6 + Math.random() * 1.8 + "s";
    d.style.animationDelay = Math.random() * .4 + "s";
    d.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 4200);
  }
}


// sparkles
(() => {
  const box = document.getElementById("sparkles");
  const n = window.innerWidth < 600 ? 10 : 18;
  for (let i = 0; i < n; i++) {
    const el = document.createElement("i");
    if (i % 4 === 0) el.className = "star";
    el.style.left = Math.random() * 100 + "%";
    el.style.top = Math.random() * 100 + "%";
    el.style.animationDuration = 2.5 + Math.random() * 4 + "s";
    el.style.animationDelay = -Math.random() * 6 + "s";
    box.appendChild(el);
  }
})();

const matches = () => true;

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function render() {
  listEl.innerHTML = "";
  ITEMS.filter(matches).forEach(it => {
    const c = claims[it.id] || [];
    const myKey = c.map(x => x.key).find(k => mine[k]);
    // a single gift claimed by someone else is hidden for everyone else
    if (!it.multi && c.length && !myKey) return;
    const li = document.createElement("li");
    li.className = "item" + (!it.multi && myKey ? " claimed" : "");
    const taken = !it.multi && !!myKey;
    const metaBits = [
      it.price && `<span class="price">${esc(it.price)}</span>`,
      it.link && `<a href="${esc(it.link)}" target="_blank" rel="noopener">Buy here ↗</a>`,
    ].filter(Boolean).join(" · ");
    let right;
    if (myKey) {
      right = `<span class="status">✓ You're getting this</span><button class="undo" data-undo="${esc(myKey)}">Changed my mind, undo</button>`;
    } else {
      right = `<button class="claim" data-claim="${esc(it.id)}">I'll get this</button>`;
    }
    const grad = TAG_COLORS[it.tag] || TAG_COLORS.default;
    const pic = (it.logo || (it.img && it.multi))
      ? `<div class="pic" style="--g:${grad}"><img class="photo${it.logo ? " logo" : ""}" src="${esc(it.logo || it.img)}" alt="${esc(it.brand || "")}" loading="lazy" style="${it.fit === "cover" ? "object-fit:cover;padding:0" : ""}" onerror="this.remove()"><span class="emoji">${it.emoji || "🎁"}</span><span class="tag">${esc(it.tag || "")}</span></div>`
      : it.multi && it.brand
      ? `<div class="pic gc" style="--g:${grad}"><div class="card" style="--gc:${it.gc || "#555"}"><div class="brand">${esc(it.brand)}</div><div class="row2"><span>GIFT CARD</span><span class="e">${it.emoji || "🎁"}</span></div></div></div>`
      : `<div class="pic" style="--g:${grad}">${it.img ? `<img class="photo" src="${esc(it.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}<span class="sparkle s1">✨</span><span class="emoji">${it.emoji || "🎁"}</span><span class="sparkle s2">✨</span><span class="tag">${esc(it.tag || "")}</span>${taken && !it.multi ? `<span class="stamp">YOURS ✓</span>` : ""}</div>`;
    li.innerHTML = `${pic}<div class="body"><div class="name">${esc(it.name)}</div><div class="meta">${metaBits}</div>${it.note ? `<div class="noteline">${esc(it.note)}</div>` : ""}<div class="right">${right}</div></div>`;
    listEl.appendChild(li);
  });
  if (!listEl.children.length) listEl.innerHTML = `<li class="empty">Nothing left here, everything is taken</li>`;
}

const dlg = document.getElementById("dlg");
let pending = null;
listEl.addEventListener("click", async e => {
  const cId = e.target.dataset.claim, uId = e.target.dataset.undo;
  if (cId) {
    pending = cId;
    const itm = ITEMS.find(i => i.id === cId);
    document.getElementById("dlgItem").textContent = itm.name;
    document.getElementById("dlgHint").textContent = itm.multi
      ? "It stays on the list, and nobody can see who's getting it."
      : "It will disappear from the list for everyone else. Only you will still see it here, so you can undo.";
    document.getElementById("dlgEmoji").textContent = itm.emoji || "🎁";
    dlg.showModal();
  }
  if (uId) { await store.unclaim(uId); delete mine[uId]; saveMine(); render(); }
});
document.getElementById("dlgCancel").onclick = () => dlg.close();
document.getElementById("dlgOk").onclick = async () => {
  const name = "";
  const id = pending; dlg.close();
  const item = ITEMS.find(i => i.id === id);
  if (!item.multi && claims[id]?.length) { render(); return; }
  const key = await store.claim(id, name);
  mine[key] = true; saveMine(); render();
  confetti();
};


render();
</script>
